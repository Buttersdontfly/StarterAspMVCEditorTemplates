name: Publish

# Publishes on a GitHub Release. MinVer derives the version from the tag, so tag
# as v1.0.0 (or v1.0.0-beta.1 for a prerelease) and publish the release.
#
# Two things to know if this never starts:
#
#  1. Release-triggered workflows only run from the version of the file on the
#     DEFAULT BRANCH. A publish.yml sitting on a feature branch is invisible to
#     the release event, however correct it looks.
#  2. Saving a release as a draft fires nothing. The `published` event happens
#     when you press Publish release. Pushing the tag alone does not do it.
#
# workflow_dispatch is here so a release can be re-run by hand after a transient
# failure, and so the pipeline can be exercised without burning a version. It is
# gated by the same environment, so it grants no extra access.
on:
  # Pushing a v* tag publishes. This is the trigger most people expect, and the
  # nuget-release environment is what keeps it deliberate: add a required
  # reviewer there and every push waits for approval regardless of trigger.
  push:
    tags: [ 'v*' ]

  # Publishing a GitHub Release also publishes, for a release-notes-first flow.
  # Both are safe together: the push uses --skip-duplicate, so whichever runs
  # second finds the version already there and does nothing.
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify, but do not push to nuget.org'
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  MSBUILDDISABLENODEREUSE: 1
  DOTNET_CLI_USE_MSBUILD_SERVER: 0

jobs:
  publish:
    runs-on: ubuntu-latest

    # Gates the job so you can require a reviewer, and lets the nuget.org
    # trusted publishing policy pin the environment claim as well as the repo.
    # If you set this, enter the SAME name in the policy's Environment field.
    environment: nuget-release

    permissions:
      contents: read
      id-token: write   # required: without it the OIDC token request fails

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Migrations and vendored assets are generated, not committed. Publishing
      # without them produces a template that installs and then fails at runtime
      # with no database tables and no styling.
      - name: Restore generated content
        shell: pwsh
        run: ./build/Initialize-Repo.ps1

      - name: Refuse to publish without generated content
        shell: pwsh
        run: |
          $content = 'src/StarterAspMVCEditorTemplates.Templates/content/StarterAspMVCEditorTemplates/src/StarterAspMVCEditorTemplates'
          if (-not (Get-ChildItem "$content/Migrations" -Filter *.cs -ErrorAction SilentlyContinue)) {
              throw 'No migrations. The published template would create an empty database.'
          }
          if (-not (Test-Path "$content/wwwroot/lib/bootstrap/css/bootstrap.min.css")) {
              throw 'No vendored assets. The published template would render unstyled.'
          }
          Write-Host 'Generated content present.' -ForegroundColor Green

      - name: Pack
        run: dotnet pack src/StarterAspMVCEditorTemplates.Templates -c Release -o ./artifacts

      # Smoke-test the actual artifact before it is pushed: install it and
      # generate + build both combos. Publishing a template that does not
      # instantiate is the failure mode worth spending 90 seconds to avoid.
      - name: Verify the packed template instantiates
        run: |
          dotnet new install ./artifacts/*.nupkg
          dotnet new starterasp-mvc -n VerifyIdentity -o ./verify/identity --auth identity
          dotnet new starterasp-mvc -n VerifyPlain    -o ./verify/none     --auth none
          dotnet build ./verify/identity
          dotnet build ./verify/none

      # Kept immediately before the push: the issued key is short-lived, about an
      # hour. Skipped on a dry run, which needs no credentials at all -- useful
      # for testing the pipeline before the trusted publishing policy exists.
      - name: NuGet login (OIDC to short-lived API key)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT the email

      - name: Push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "### Dry run" >> $GITHUB_STEP_SUMMARY
          echo "Packed and verified. Nothing was pushed to nuget.org." >> $GITHUB_STEP_SUMMARY
          ls -la ./artifacts >> $GITHUB_STEP_SUMMARY
