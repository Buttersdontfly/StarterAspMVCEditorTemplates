name: Publish

# Publishes on a GitHub Release. MinVer derives the version from the tag, so tag

on:
  # Pushing a v* tag publishes. This is the trigger most people expect, and the
  # nuget-release environment is what keeps it deliberate: add a required
  # reviewer there and every push waits for approval regardless of trigger.
  push:
    tags: [ 'v*' ]

  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify, but do not push to nuget.org'
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  MSBUILDDISABLENODEREUSE: 1
  DOTNET_CLI_USE_MSBUILD_SERVER: 0

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: nuget-release

    permissions:
      contents: read
      id-token: write   # required: without it the OIDC token request fails

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore generated content
        shell: pwsh
        run: ./build/Initialize-Repo.ps1

      - name: Refuse to publish without generated content
        shell: pwsh
        run: |
          $content = 'src/StarterAspMVCEditorTemplates.Templates/content/StarterAspMVCEditorTemplates/src/StarterAspMVCEditorTemplates'

          foreach ($provider in 'Sqlite', 'SqlServer') {
              $folder = "$content/Migrations/$provider"
              if (-not (Get-ChildItem $folder -Filter *.cs -Recurse -ErrorAction SilentlyContinue)) {
                  throw "No $provider migrations in $folder. Run ./build/Generate-Migrations.ps1, which produces both sets."
              }
          }

          if (-not (Test-Path "$content/wwwroot/lib/bootstrap/css/bootstrap.min.css")) {
              throw 'No vendored assets. The published template would render unstyled. Run ./build/Get-VendorAssets.ps1'
          }

          Write-Host 'Generated content present.' -ForegroundColor Green

      - name: Pack
        run: dotnet pack src/StarterAspMVCEditorTemplates.Templates -c Release -o ./artifacts

      - name: Verify the packed template instantiates
        run: |
          dotnet new install ./artifacts/*.nupkg
          dotnet new starterasp-mvc -n VerifyIdentity -o ./verify/identity --auth identity
          dotnet new starterasp-mvc -n VerifyPlain    -o ./verify/none     --auth none
          dotnet build ./verify/identity
          dotnet build ./verify/none

      - name: NuGet login (OIDC to short-lived API key)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "### Dry run" >> $GITHUB_STEP_SUMMARY
          echo "Packed and verified. Nothing was pushed to nuget.org." >> $GITHUB_STEP_SUMMARY
          ls -la ./artifacts >> $GITHUB_STEP_SUMMARY
